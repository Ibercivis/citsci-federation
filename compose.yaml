# The Broker, and the one Identity Source its tests need to steer.
#
# BROKER_MODE in `.env` decides which Broker this is: `testing` adds the
# testing layer to the realm and starts the Mock Identity Source and the mail
# catcher, `production` does none of it, and `demo` starts the mail catcher
# alone. `.env` derives COMPOSE_PROFILES from it, which is how those two
# services follow the same switch.
#
# Three services make up what a Brokered App sees as one frontier: a reverse
# proxy, the OpenID provider behind it, and the provider's own database. A
# fourth stands outside that frontier, where Google and GitHub stand: the
# Mock Identity Source, which exists only for the tests.
#
# This file is the whole of what `pnpm test` needs, and the whole of what CI
# starts. The Brokered Apps are declared beside it in compose.apps.yaml, which
# is the other half of the Brokered Composition (ADR-0009) and is brought up with
# `pnpm apps:up`; the one thing this file holds about an application is the
# client the Broker knows it by, in the realm it imports.
#
# Every credential here is a development constant on purpose, and `.env` says
# why.

name: citsci-broker

services:
  # The reverse proxy, in front in every environment including this one
  # (ADR-0001). The reason is parity of form rather than the issuer string:
  # the cookie, TLS, redirect-URI and CORS failures that depend on deployment
  # shape otherwise appear for the first time in production. It is also why
  # Keycloak publishes no port of its own — there is no way to reach the
  # Broker here that bypasses the shape production will have.
  proxy:
    image: caddy:2.11-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    # Every address the proxy serves, read from the one file that declares it
    # (ADR-0001). The Caddyfile substitutes `{$NAME}` from this environment
    # when it loads, so a hostname is written once in `.env` and nowhere else.
    #
    # The Brokered Apps' addresses are here too, in the Broker-only stack: the
    # file is one file, and a block whose container is not up answers 502 and
    # names it. Leaving them out would mean two Caddyfiles disagreeing about
    # the Broker instead.
    environment:
      LOSTATNIGHT_BASE_URL: ${LOSTATNIGHT_BASE_URL:?declare it in .env}
      GEONITY_API_BASE_URL: ${GEONITY_API_BASE_URL:?declare it in .env}
      GEONITY_WEB_BASE_URL: ${GEONITY_WEB_BASE_URL:?declare it in .env}
      GEONITY_ADMIN_BASE_URL: ${GEONITY_ADMIN_BASE_URL:?declare it in .env}
      OPENRED_API_BASE_URL: ${OPENRED_API_BASE_URL:?declare it in .env}
      OPENRED_WEB_BASE_URL: ${OPENRED_WEB_BASE_URL:?declare it in .env}
      MAIL_BASE_URL: ${MAIL_BASE_URL:?declare it in .env}
      BROKER_ISSUER: ${BROKER_ISSUER:?declare it in .env}
    # BROKER_SITE is the issuer with its realm path dropped, which is the
    # address the proxy serves the Broker at. It is derived here, by the
    # container's own shell, exactly as Keycloak's `--hostname` is below: the
    # issuer stays the one declared string, and no second variable can
    # disagree with it.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - export BROKER_SITE="$${BROKER_ISSUER%/realms/*}" && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    networks:
      default:
        aliases:
          # The other half of one issuer. `broker.localhost` is the loopback
          # address for a browser and this proxy for anything on this network,
          # so the name a Brokered App is told to trust resolves on both
          # sides of the port mapping. Remove this and a containerised app
          # loses its issuer, with an error that names nothing.
          - broker.localhost
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      # The proxy's own readiness, answered without troubling Keycloak: it is
      # already waited for above.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    # Keycloak at a pinned version plus our extensions and the realm, built
    # from broker/Dockerfile, which is where the version is pinned and why.
    build:
      context: ./broker
      args:
        BROKER_MODE: ${BROKER_MODE:?declare it in .env}
        # Written into the testing layer by the build, which refuses a
        # testing image without it. Production does not read it.
        MOCK_ISSUER: ${MOCK_ISSUER:-}
    # The channel for a value that must not be typed into a tracked file: the
    # launch Identity Sources' credentials, named in `.env.example`. It is
    # absent on most machines, and absent is not an error: each of those names
    # imports as `not-configured`, and only a sign-in through that source
    # fails.
    #
    # What reads it is the realm import. A `${NAME}` in
    # broker/realm/ is replaced from this container's environment,
    # on the version pinned in broker/Dockerfile; `${env.NAME}` is not, and
    # survives the import as a literal.
    #
    # Only for names the `environment:` block below does not also declare:
    # that block wins, and an override from here is dropped without a word.
    # BROKER_ISSUER is declared there, so it cannot be changed from this file.
    env_file:
      - path: .env.local
        required: false
    environment:
      # The issuer, read from the one place that declares it (ADR-0001). What
      # Keycloak is told is derived from that string by dropping the realm
      # path off the end of it — the issuer is never assembled from parts,
      # which is the habit the ADR exists to break. Keycloak wants the origin;
      # the realm path it serves under comes from the realm's own name, and
      # the discovery case fails loudly if the two disagree.
      BROKER_ISSUER: ${BROKER_ISSUER:?declare it in .env}
      # The client each application of the Brokered Composition is registered
      # as: its id, its redirect URI and the secret it authenticates with, all
      # substituted into the realm by the import. They are declared in `.env`
      # and read from there by the application's own container too
      # (compose.apps.yaml), so an id or a secret is written once.
      #
      # The Broker-only stack reads them too, and has to: the three clients
      # are in the base layer, so the Broker knows its applications in either
      # mode, and an unset name survives the import as the literal `${NAME}`
      # — a client whose secret is that string, which is worse than one that
      # is absent. broker/README.md says what the registration asserts and
      # what it leaves to the integration.
      LOSTATNIGHT_BASE_URL: ${LOSTATNIGHT_BASE_URL:?declare it in .env}
      LOSTATNIGHT_CLIENT_ID: ${LOSTATNIGHT_CLIENT_ID:?declare it in .env}
      LOSTATNIGHT_CLIENT_SECRET: ${LOSTATNIGHT_CLIENT_SECRET:?declare it in .env}
      GEONITY_WEB_BASE_URL: ${GEONITY_WEB_BASE_URL:?declare it in .env}
      GEONITY_CLIENT_ID: ${GEONITY_CLIENT_ID:?declare it in .env}
      GEONITY_CLIENT_SECRET: ${GEONITY_CLIENT_SECRET:?declare it in .env}
      OPENRED_API_BASE_URL: ${OPENRED_API_BASE_URL:?declare it in .env}
      OPENRED_CLIENT_ID: ${OPENRED_CLIENT_ID:?declare it in .env}
      OPENRED_CLIENT_SECRET: ${OPENRED_CLIENT_SECRET:?declare it in .env}
      # Behind the proxy, over HTTP, in production mode: the shape the ADR
      # asks for, with TLS terminated in front rather than absent.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://broker-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: "true"
      # Where the Broker sends its mail. The base needs a mail server in every
      # mode but cannot name one, so it reads `${SMTP_HOST}` and `${SMTP_PORT}`
      # from here. `.env` says why it is the mail catcher.
      SMTP_HOST: ${SMTP_HOST:?declare it in .env}
      SMTP_PORT: ${SMTP_PORT:?declare it in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    # The realm is imported from the one the image carries, derived from
    # broker/realm/, and configured nowhere else: the admin console takes no
    # part in it.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - exec /opt/keycloak/bin/kc.sh start --import-realm --hostname "$${BROKER_ISSUER%/realms/*}"
    depends_on:
      broker-db:
        condition: service_healthy
    healthcheck:
      # The image ships no curl and no wget, so readiness is read off the
      # management port with the shell's own TCP redirection.
      #
      # It reads the HTTP status line, not the body, and that is the whole
      # point. The body is a list, and every entry carries a `status` of its
      # own:
      #
      #   {"status": "DOWN", "checks": [
      #       {"name": "Graceful Shutdown",    "status": "UP"},
      #       {"name": "Keycloak Initialized", "status": "DOWN"}]}
      #
      # `Graceful Shutdown` is UP from the first second the port answers, so a
      # grep for `"status": "UP"` matches that nested one and reports the
      # Broker ready while it is still importing the realm. The endpoint
      # answers 503 until the whole list is UP and 200 after, so the status
      # line is the one unambiguous signal. Do not match on the body.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '^HTTP/1.1 200' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  # Keycloak's own store. Deliberately not published to the host: another
  # development stack on the same machine already wants the default
  # PostgreSQL port, and the two must not compete for it. Nothing here needs
  # reaching from outside this network anyway — the issuer is not in this
  # database and never will be (ADR-0001).
  broker-db:
    image: postgres:19-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      # PostgreSQL 18 wants a single mount one level up, so that its data
      # lands in a version-named subdirectory and pg_upgrade can work.
      - broker-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The Broker's SMTP endpoint, which the spec stops treating as optional:
  # ADR-0004 and ADR-0005 both rest on the Broker being able to confirm an
  # address. Locally it is a catcher, which accepts every message and delivers
  # none — a real server here would mail whatever address somebody typed into
  # a local form. Keycloak is pointed at it by `SMTP_HOST` and `SMTP_PORT`, and
  # every application of the Brokered Composition sends here too
  # (compose.apps.yaml).
  #
  # Its inbox is at MAIL_BASE_URL through the proxy, like every other address
  # here, and it publishes no port of its own: each application's own local
  # stack publishes one for a catcher of its own, and docs/local-development.md
  # has 8025, 8026 and 8027 spoken for already.
  #
  # It accepts any SMTP credential, and an insecure one, because the
  # applications send with the settings their own stacks use: a catcher that
  # refused them would fail a sign-up for a reason production does not have.
  #
  # Not in `production`: a deployment sends real mail, and a catcher beside it
  # would swallow every confirmation. In `demo` catching every message is the
  # point, because nobody watching a demo should be mailed by accident.
  mailpit:
    profiles: [testing, demo]
    image: axllent/mailpit:v1.34.0
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The Mock Identity Source: a test Identity Source this repository
  # declares and runs itself, so that what a source says about an address can
  # be decided by hand (mock-source/). It is not a launch source and not
  # part of the Broker; it stands where Google and GitHub stand, outside it,
  # and that is why it is not behind the proxy. Only in `testing`.
  mock-source:
    profiles: [testing]
    build:
      context: .
      dockerfile: mock-source/Dockerfile
    environment:
      # Not `:?`: Compose interpolates a service whose profile is off, and a
      # production Broker has no Mock Identity Source. The server refuses to
      # start without it, and the testing image refuses to build without it.
      MOCK_ISSUER: ${MOCK_ISSUER:-}
      BROKER_ISSUER: ${BROKER_ISSUER:?declare it in .env}
    ports:
      - "8090:8090"
    networks:
      default:
        aliases:
          # The other half of its issuer, as for the proxy above: `.env`
          # says why one name has to work on both sides.
          - mock.localhost
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O- http://127.0.0.1:8090/.well-known/openid-configuration",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  broker-db-data:
