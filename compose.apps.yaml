# The applications of the Brokered Composition (ADR-0009), on top of the Broker
# that compose.yaml declares. Both files together are the composition, and
# `pnpm apps:up` is the one command that brings it up:
#
#     docker compose -f compose.yaml -f compose.apps.yaml up -d --build --wait
#
# `name:` below replaces the Broker-only project's, so the composition is its
# own set of containers: `pnpm broker:up` keeps starting the four services the
# test suite needs and nothing else, and the two cannot be confused for each
# other. They cannot run at the same time either — one proxy, one port 8080 —
# and that is right, because this one contains the other.
#
# **`pnpm test` reaches into whichever of the two is up**, and asks docker
# which one that is rather than assuming (`tests/stack.ts`), so this one does
# not have to come down first. What it reaches with is `exec`, into a container
# already running: `run` would start a stack that is down instead of saying so
# (issue #106).
#
# **No application's code is declared or vendored here.** Each service below
# builds from `apps/<repository>`, which scripts/checkout-apps.sh checks out at
# that repository's `federation` branch; the Dockerfile it builds with belongs
# to the application and lives on that branch (ADR-0009). What this file holds
# is the composition: which applications are in it, what each one is told, and
# the datastores each one needs.
#
# **Most of the pins below are not ours to move** (ADR-0017). A datastore that
# stands in for one the application runs carries that application's own tag,
# and the comment on it names the file it mirrors: it moves when they move it,
# never ahead. Every pin here with no such comment was chosen in this
# repository, and ADR-0017 says which of those are free to raise.
#
# **Nothing here publishes a port.** Every service is reached through the proxy
# by the hostname `.env` declares for it, so cookies, redirect URIs and CORS
# take the shape they will have in production. The databases are not published
# either: a laptop running these applications' own stacks already has 5432 and
# 5436 taken, and nothing outside this network needs to read them.
#
# **This is the development build** (ADR-0009). Every credential here is a
# development constant, the Django development server serves every request,
# DEBUG is on, and the data is invented. Nothing in this state is what gets
# deployed — hardening it is later work on this same composition.
#
# What is NOT here yet, and the ticket that brings it:
#
#   * Geonity's Flutter client and OpenRed's Flutter client.
#   * The schedulers and the queues that carry no mail. The composition exists
#     to try signing in; a recurring weather job is scenery.

name: citsci-apps

# ----------------------------------------------------------------- shared
#
# Where the Broker is reaches every application as configuration, read from
# `.env`, never compiled in (ADR-0001) — under the name each one's integration
# settled, in that application's own words, on its `federation` branch. All
# three chose `IBERCIVIS_ACCOUNT_*`: LostAtNight (`issue #94`), Geonity
# (`issue #31`) and OpenRed (`issue #30`). An Ibercivis account is what they
# call signing in through the Broker, and `Broker` names nothing in a Django
# site that already has a task queue.
#
# Every process of every application is told, worker included, so one settings
# file answers for all of them; only the service that runs the sign-in is given
# the credentials. Each front end reads the same value under its own build
# tool's prefix, which an anchor cannot carry.
#
# The value is the issuer, which has to be reachable from inside this network as
# well as from a browser: the proxy answers to `broker.localhost` on both sides
# of the port mapping, and `.env` says why it has to.
x-ibercivis-account: &ibercivis-account
  IBERCIVIS_ACCOUNT_ISSUER: ${BROKER_ISSUER:?declare it in .env}

# The catcher every application here sends to; the service itself is declared
# in compose.yaml, where the Broker's own stack is. All three applications keep
# email verification mandatory, as production does, so a sign-up cannot be
# finished without reading the message — and nothing in the composition can
# deliver one to a real address.
x-mail: &mail
  EMAIL_HOST: mailpit
  EMAIL_PORT: "1025"

# What every LostAtNight process is told, worker included. Its datastores and
# the host validation the proxy makes safe — but not the client credentials:
# those are given to the service that runs the sign-in and to nothing else.
x-lostatnight: &lostatnight
  <<: *ibercivis-account
  DJANGO_SETTINGS_MODULE: gdalface.settings_local
  DEBUG: "True"
  # Host validation is left open because the proxy is the only way in and it
  # forwards nothing but the hostnames it serves. The alternative is to repeat
  # an address `.env` already declares, in a form Django can parse, which is
  # the duplication ADR-0001 exists to prevent.
  ALLOWED_HOSTS: "*"
  DB_NAME: gdalface
  DB_USER: gdalface
  DB_PASSWORD: gdalface
  DB_HOST: lostatnight-db
  DB_PORT: "5432"
  REDIS_HOST: lostatnight-redis
  # Not a key, and nothing here reaches NASA with it. `config('NASA_API_KEY')`
  # has no default in that application, so the jobs its scheduler registers
  # raise rather than run without one. Its own LOCAL-DEV.md says the same thing
  # for the same reason.
  NASA_API_KEY: "composition-not-a-real-key"

# What every Geonity process is told, worker included: its datastores, the
# filler that settings file insists on, and where the Broker is. The client
# credentials go to the API alone.
x-geonity: &geonity-env
  <<: [*ibercivis-account, *mail]
  # Set explicitly rather than left to the default: that settings file
  # infers DEBUG from whether `runserver` is on the command line, so the
  # worker would start with DEBUG=False and try to reach SES with the
  # filler credentials below.
  DEBUG: "True"
  ALLOWED_HOSTS: "*"
  BASE_URL: ${GEONITY_API_BASE_URL:?declare it in .env}
  DB_NAME: citsci
  DB_USER: citsci
  DB_PASSWORD: citsci
  DB_HOST: geonity-db
  REDIS_HOST: geonity-redis
  # Filler, and it has to be present: that settings file reads these
  # without a default. Nothing is sent to SES — the mail goes to the
  # catcher above.
  FROM_EMAIL: geonity@geonity.invalid
  AWS_ACCESS_KEY_ID: dev
  AWS_SECRET_ACCESS_KEY: dev
  AWS_SES_REGION_NAME: eu-west-1
  AWS_SES_REGION_ENDPOINT: https://email.eu-west-1.amazonaws.com
  # The keys its two front ends identify themselves with, which the web
  # app below is given the web half of.
  CLIENT_API_KEY_MOBILE: dev-mobile
  CLIENT_API_KEY_WEB: dev-web

# The port answering, which is all a port check proves: a development server
# binds it after its own system checks pass, and a 500 on a page is not this
# check's business. They are here so that `up --wait` returns when the
# composition is reachable rather than merely created — each service keeps its
# own patience, which is what differs between them, and shares the command,
# which does not.
x-django-port-check:
  &django-port-check [
    "CMD-SHELL",
    'python -c "import socket; socket.create_connection((''127.0.0.1'', 8000), 5)"',
  ]

x-vite-port-check:
  &vite-port-check [
    "CMD-SHELL",
    'node -e "require(''net'').connect(5173, ''127.0.0.1'').on(''connect'', () => process.exit(0)).on(''error'', () => process.exit(1))"',
  ]

# Every queue in the composition is backed by its application's own Redis, and
# nothing distinguishes one of them from another.
x-redis-check: &redis-check
  test: ["CMD", "redis-cli", "ping"]
  interval: 5s
  timeout: 5s
  retries: 20

services:
  # ------------------------------------------------------- LostAtNight
  #
  # Ibercivis/gdalface: Django with templates, PostgreSQL, Redis and GDAL. A
  # server-rendered site, so LOSTATNIGHT_BASE_URL is the whole application.

  lostatnight-db:
    # Mirrors apps/gdalface/docker-compose.local.yml.
    image: postgres:16
    environment:
      POSTGRES_DB: gdalface
      POSTGRES_USER: gdalface
      POSTGRES_PASSWORD: gdalface
    volumes:
      - lostatnight-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gdalface -d gdalface"]
      interval: 5s
      timeout: 5s
      retries: 20

  lostatnight-redis:
    # Mirrors apps/gdalface/docker-compose.local.yml.
    image: redis:7-alpine
    healthcheck: *redis-check

  lostatnight:
    build:
      context: ./apps/gdalface
      dockerfile: Dockerfile.local
    # The one bind mount in this file, and it is load-bearing rather than for
    # convenience: that image installs the dependencies and copies no code, so
    # the application is the checkout. Everything else here is built into its
    # image from the checkout instead.
    volumes:
      - ./apps/gdalface:/app
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      <<: [*mail, *lostatnight]
      # The origin a form is posted from, which Django needs in full and which
      # is exactly the string `.env` declares.
      CSRF_TRUSTED_ORIGINS: ${LOSTATNIGHT_BASE_URL:?declare it in .env}
      IBERCIVIS_ACCOUNT_CLIENT_ID: ${LOSTATNIGHT_CLIENT_ID:?declare it in .env}
      IBERCIVIS_ACCOUNT_CLIENT_SECRET: ${LOSTATNIGHT_CLIENT_SECRET:?declare it in .env}
    depends_on:
      lostatnight-db:
        condition: service_healthy
      lostatnight-redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: *django-port-check
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # The queue the site hands its slow work to, mail included.
  lostatnight-worker:
    build:
      context: ./apps/gdalface
      dockerfile: Dockerfile.local
    volumes:
      - ./apps/gdalface:/app
    # `lost_scheduler` is the only queue that application's settings declare,
    # and the one every `@job` of its own names. `rqworker default` exits 1 with
    # `KeyError: 'default'` before it listens, and nothing in here waits on the
    # worker, so the composition comes up with its slow work silently dead.
    command: python manage.py rqworker lost_scheduler
    environment:
      <<: [*mail, *lostatnight]
    depends_on:
      lostatnight-db:
        condition: service_healthy
      lostatnight-redis:
        condition: service_healthy

  # ----------------------------------------------------------- Geonity
  #
  # Ibercivis/citsci-api is the API; Ibercivis/Geonity holds the web app and
  # the admin panel, which are Vite dev servers in front of it. Three
  # addresses, one client: the API is the part that holds the secret.

  geonity-db:
    # PostGIS, from the same maintainer's multi-arch build rather than
    # postgis/postgis, which is amd64 only — the application's own compose file
    # says so and this follows it. Mirrors apps/citsci-api/compose.yaml, tag
    # included.
    image: imresamu/postgis:16-3.5
    environment:
      POSTGRES_DB: citsci
      POSTGRES_USER: citsci
      POSTGRES_PASSWORD: citsci
    volumes:
      - geonity-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citsci -d citsci"]
      interval: 5s
      timeout: 5s
      retries: 20

  geonity-redis:
    # Mirrors apps/citsci-api/compose.yaml.
    image: redis:7-alpine
    healthcheck: *redis-check

  geonity-api:
    build: ./apps/citsci-api
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      <<: *geonity-env
      # Only the API holds the secret. The web app sends the browser to the
      # Broker and brings the code back to its own callback; the API redeems
      # it, naming that same callback.
      IBERCIVIS_ACCOUNT_CLIENT_ID: ${GEONITY_CLIENT_ID:?declare it in .env}
      IBERCIVIS_ACCOUNT_CLIENT_SECRET: ${GEONITY_CLIENT_SECRET:?declare it in .env}
      IBERCIVIS_ACCOUNT_REDIRECT_URI: ${GEONITY_WEB_BASE_URL:?declare it in .env}/auth/ibercivis/callback
    depends_on:
      geonity-db:
        condition: service_healthy
      geonity-redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: *django-port-check
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # The queue that sends half of this application's mail; a view sends the
  # other half inline, which is why both need the catcher.
  geonity-worker:
    build: ./apps/citsci-api
    command: python manage.py rqworker citisciapi
    environment: *geonity-env
    depends_on:
      geonity-db:
        condition: service_healthy
      geonity-redis:
        condition: service_healthy

  # The web app: a Vite dev server, so the application is the checkout and the
  # image is a plain Node.
  #
  # So the three front ends in this composition — this one, the admin panel
  # below and OpenRed's React app — are where a service's recipe is here rather
  # than on the application's `federation` branch, which is what ADR-0009 asks
  # for. It is not an omission to correct: none of them needs a recipe, because
  # a stock Node image and the checkout is all any of them is, and no dev
  # server among them has to be configured to answer to a `.localhost`
  # hostname. `docs/local-development.md` records why, per application.
  #
  # `npm install` rather than `npm ci` — this
  # repository's lock file is out of step with its package.json, which its
  # LOCAL-DEV.md records as pre-existing and not ours to fix. node_modules is a
  # volume so the install survives a restart and stays out of the checkout.
  #
  # `--no-package-lock` because the checkout is somebody else's repository and
  # this composition does not write to it: an install that resolved the lock
  # file afresh would leave `apps/geonity` dirty, and
  # scripts/checkout-apps.sh refuses to update a dirty checkout — so running
  # the composition once would quietly stop it from ever updating this one
  # again. The lock file is already not what is installed from.
  #
  # Debian rather than Alpine on purpose: musl resolves every name under
  # `.localhost` to the loopback and never asks Docker's DNS, so an Alpine
  # container could not reach the Broker at its issuer (`.env` says why).
  geonity-web:
    image: node:26-bookworm-slim
    working_dir: /app
    volumes:
      - ./apps/geonity/react:/app
      - geonity-web-node-modules:/app/node_modules
    command: sh -c "npm install --no-package-lock --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      # The API through this dev server's own proxy, not from the browser: the
      # API sends no CORS headers, so a browser calling it cross-origin is
      # blocked before the request leaves. In production the reverse proxy does
      # the same job for `geonity.ibercivis.es`.
      VITE_DEV_PROXY_TARGET: http://geonity-api:8000
      VITE_API_URL: /api-proxy/api
      # Read by the browser, so this one is the address the proxy serves.
      VITE_MEDIA_URL: ${GEONITY_API_BASE_URL:?declare it in .env}
      VITE_OBSERVATIONS_API_KEY: dev-web
      # The Broker's issuer and the client the API is registered as: the web
      # app reads discovery from the issuer, in the browser, and asks for a
      # code for that client. The secret is not here, and nothing a browser
      # loads could keep it.
      VITE_IBERCIVIS_ACCOUNT_ISSUER: ${BROKER_ISSUER:?declare it in .env}
      VITE_IBERCIVIS_ACCOUNT_CLIENT_ID: ${GEONITY_CLIENT_ID:?declare it in .env}
      # Mapbox needs an access token nobody has locally. The map area stays
      # blank and every other screen works, which is deliberate: what has to
      # work here is signing in (docs/local-development.md).
      VITE_MAPBOX_TOKEN: ""
    depends_on:
      geonity-api:
        condition: service_healthy
    healthcheck:
      test: *vite-port-check
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  # The admin panel, the other Vite dev server. Its own default API is the live
  # site, which is why every target below is set: unconfigured, this panel
  # reads and writes production (its LOCAL-DEV.md says so).
  geonity-admin:
    image: node:26-bookworm-slim
    working_dir: /app
    volumes:
      - ./apps/geonity/admin:/app
      - geonity-admin-node-modules:/app/node_modules
    command: sh -c "npm install --no-package-lock --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_BASE_URL: ""
      VITE_API_PROXY_TARGET: http://geonity-api:8000
      VITE_API_COLUMNS_PROXY_TARGET: http://geonity-api:8000
      VITE_API_ADMIN_FIELDS_PROXY_TARGET: http://geonity-api:8000
      VITE_MAPBOX_TOKEN: ""
      VITE_GOOGLE_CLIENT_ID: ""
    depends_on:
      geonity-api:
        condition: service_healthy
    healthcheck:
      test: *vite-port-check
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  # ----------------------------------------------------------- OpenRed
  #
  # Ibercivis/OpenRed is the API; Ibercivis/openred-react is the React front
  # end in front of it, at `openred.localhost`. Two addresses, one client: the
  # API is the part that holds the secret.

  openred-db:
    # PostgreSQL with PostGIS *and* h3, built by the application: its raw SQL
    # calls a server-side h3 function, and no postgis/postgis tag can have
    # h3-pg added to it. Its LOCAL-DEV.md carries the measurement.
    #
    # Built rather than pinned, and the recipe is ours: the base it builds on is
    # pinned on OpenRed's `federation` branch, with nothing upstream to mirror
    # (ADR-0017).
    build: ./apps/openred/local_dev/postgis-h3
    environment:
      POSTGRES_DB: openred_db
      POSTGRES_USER: openred_user
      POSTGRES_PASSWORD: openred
    volumes:
      - openred-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openred_user -d openred_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  openred-redis:
    # Mirrors apps/openred/compose.yaml.
    image: redis:7-alpine
    healthcheck: *redis-check

  openred-api:
    build: ./apps/openred
    # Its own entrypoint, which waits for the database, migrates, collects the
    # admin's static files and then serves. One image, four roles, chosen by
    # this argument.
    command: ["api"]
    environment: &openred-env
      <<: [*ibercivis-account, *mail]
      # No default in that settings file, so it has to be given.
      SECRET_KEY: local-development-only-not-a-secret
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      CSRF_TRUSTED_ORIGINS_EXTRA: ${OPENRED_API_BASE_URL:?declare it in .env}
      # Where its mail links send a Person: the front end's own address.
      FRONTEND_URL: ${OPENRED_WEB_BASE_URL:?declare it in .env}
      # The Broker, under the names OpenRed's integration gives it (`issue #30`),
      # the same three Geonity reads. Only the API holds the secret: the React
      # app brings the code back to its own callback page and this side redeems
      # it, naming that same page.
      IBERCIVIS_ACCOUNT_CLIENT_ID: ${OPENRED_CLIENT_ID:?declare it in .env}
      IBERCIVIS_ACCOUNT_CLIENT_SECRET: ${OPENRED_CLIENT_SECRET:?declare it in .env}
      IBERCIVIS_ACCOUNT_REDIRECT_URI: ${OPENRED_WEB_BASE_URL:?declare it in .env}/auth/ibercivis/callback
      # Session authentication off, as in its own local stack: with it on, a
      # signed-in admin session makes DRF demand a CSRF token the
      # token-authenticated front end never sends.
      ENABLE_SESSION_AUTH: "False"
      DB_NAME: openred_db
      DB_USER: openred_user
      DB_PASSWORD: openred
      DB_HOST: openred-db
      DB_PORT: "5432"
      REDIS_HOST: openred-redis
      REDIS_PORT: "6379"
      REDIS_DB: "4"
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      DEFAULT_FROM_EMAIL: openred@openred.invalid
      SERVER_EMAIL: openred@openred.invalid
      # That settings file names three real staff addresses as the default.
      # Emptied here so nothing in the composition can try to mail anybody.
      TRACK_UPLOAD_NOTIFY_EMAILS: ""
      REPORT_DEFAULT_LANGUAGE: en
      # Its settings log every SQL query at DEBUG, which buries the output of
      # `seed_local` and of every other management command.
      DB_LOG_LEVEL: INFO
    volumes:
      - openred-media:/app/media
    depends_on:
      openred-db:
        condition: service_healthy
      openred-redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: *django-port-check
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  # The one queue of the three that sends mail. The other two carry track
  # processing and weather, which no sign-in waits for.
  openred-worker:
    build: ./apps/openred
    command: ["worker", "openred-emails"]
    environment: *openred-env
    volumes:
      - openred-media:/app/media
    depends_on:
      openred-db:
        condition: service_healthy
      openred-redis:
        condition: service_healthy

  # The React front end: a `react-scripts` dev server, the third of the three
  # above. webpack's host check never comes into it, for a reason that is this
  # application's rather than ours — `docs/local-development.md` carries it,
  # and `tests/openred-web.test.ts` is what notices if it stops holding.
  #
  # `npm ci` rather than Geonity's `npm install --no-package-lock`: this
  # repository's lock file *is* in step with its package.json, and `npm ci`
  # writes to neither — so the install is reproducible and the checkout stays
  # clean, which scripts/checkout-apps.sh needs in order to keep updating it.
  # It runs when the lock file is not the one already installed, which a stamp
  # inside the volume answers: `npm ci` deletes node_modules before it
  # installs, so running it on every start would do that every time.
  #
  # The stamp rather than react-scripts being present, which is what this
  # asked for until `issue #30` added a package to that lock file: on a volume
  # populated before such a branch the guard passes, nothing installs, and the
  # dev server starts without the package. The install survives a populated
  # mount, which is the question that shape raises.
  openred-web:
    image: node:24-bookworm-slim
    working_dir: /app
    volumes:
      - ./apps/openred-react:/app
      - openred-web-node-modules:/app/node_modules
    command: sh -ec "cmp -s package-lock.json node_modules/.installed || { npm ci --no-audit --no-fund; cp package-lock.json node_modules/.installed; }; exec npm start"
    environment:
      # The API through this dev server's own proxy (`src/setupProxy.js`), not
      # from the browser, as in production behind nginx — and what the front
      # end's own relative baseURL expects in development.
      #
      # This value trips that file's own guard on every start: it warns, in
      # four lines, that the target "is not a local address" and that writes go
      # there. The guard tests for `localhost`, and the composition reaches the
      # API by its service name. The address it names is this composition's,
      # and the warning in `pnpm apps:logs openred-web` means nothing else.
      OPENRED_API_PROXY: http://openred-api:8000
      # The port this application's own .env.example chooses, kept so that the
      # composition and its LOCAL-DEV.md say the same number.
      PORT: "3010"
      # Every interface, not the loopback: the container's loopback is reachable
      # from nothing, the proxy included.
      HOST: 0.0.0.0
      # `react-scripts start` opens a browser on the machine it runs on, which
      # in a container is a dependency that is not installed.
      BROWSER: none
      # Mapbox needs an access token nobody has locally. The map area stays
      # blank and every other screen works, which is deliberate
      # (`docs/local-development.md`).
      REACT_APP_MAPBOX_TOKEN: ""
      # Correctly shaped and not a real client id. `GoogleOAuthProvider` is
      # mounted unconditionally and `LoginPage` calls `useGoogleLogin` as a
      # top-level hook, so an empty value throws from Google's own script
      # before /login renders — taking the whole page down with it, the
      # Ibercivis account button included. The value is the placeholder that
      # application's .env.example ships, for the same reason. Pressing the
      # Google button fails, and locally it could not work anyway.
      REACT_APP_GOOGLE_CLIENT_ID: 000000000000-localdevplaceholder.apps.googleusercontent.com
      # The Broker's issuer and the client the API is registered as: this app
      # reads discovery from the issuer, in the browser, and asks for a code for
      # that client. The secret is not here, and nothing a browser loads could
      # keep it. `react-scripts start` compiles on every start, so these are
      # read then rather than baked into an image.
      REACT_APP_IBERCIVIS_ACCOUNT_ISSUER: ${BROKER_ISSUER:?declare it in .env}
      REACT_APP_IBERCIVIS_ACCOUNT_CLIENT_ID: ${OPENRED_CLIENT_ID:?declare it in .env}
      # REACT_APP_API_URL is deliberately absent. It is read at build time
      # only: `npm start` serves a relative baseURL and the proxy above decides
      # the target. Setting it here would name an address the running
      # composition never calls.
    depends_on:
      openred-api:
        condition: service_healthy
    healthcheck:
      # The Vite front ends' check, on the port this one serves.
      test:
        [
          "CMD-SHELL",
          'node -e "require(''net'').connect(3010, ''127.0.0.1'').on(''connect'', () => process.exit(0)).on(''error'', () => process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 90
      start_period: 60s

