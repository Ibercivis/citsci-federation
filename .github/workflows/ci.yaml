name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # What the `pre-push` hook runs, run again where `--no-verify` cannot reach.
  # Seconds, so it is the job that tells you whether to keep reading.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # `node-version-file: package.json` reads `engines.node`, so the version
      # is declared once, in the same file the dependencies are.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      # `--frozen-lockfile` fails rather than resolving something new, which is
      # what makes the exact versions in package.json mean anything.
      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      # The two below read CI's own configuration — this file, and the scripts
      # the git hooks run — which is what `pnpm check` does not and should not
      # (`issue #47`). They are steps of this job rather than a job of their
      # own because the ruleset on `main` requires status checks by name, and
      # only an administrator can add one: a new job would be a gate that
      # gates nothing.
      #
      # Neither tool publishes a GitHub Action of its own, and actionlint's
      # documentation recommends `curl | bash` from a moving branch. Each
      # author's image, pinned by digest, is the pin every action in this file
      # carries, and the shape `scripts/reuse-lint.sh` already uses.
      #
      # With no arguments actionlint finds every workflow in the repository,
      # so a file added beside this one is read without editing this step.
      - name: actionlint, over every workflow
        run: |
          docker run --rm --volume "$PWD:/repo" --workdir /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

      # ShellCheck is preinstalled on this runner and unpinned there, so an
      # image that moves it would turn a finding nobody introduced into a red
      # run on somebody else's pull request. Hence the same digest pin.
      #
      # `git ls-files` rather than `scripts/*.sh`: that glob is not recursive,
      # and `issue #102` may nest the hooks one directory down. Asking git
      # reads every tracked script wherever it sits. An empty list exits 3
      # here rather than passing, which is the failure a glob gone stale would
      # otherwise hide.
      #
      # `-f gcc` because the image carries no locale data: on a finding whose
      # source line is not ASCII the default format cannot encode it and
      # garbles the report mid-line. This one prints no source line.
      - name: shellcheck, over every tracked shell script
        run: |
          git ls-files -z '*.sh' | xargs -0 docker run --rm --volume "$PWD:/mnt" \
            koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            -f gcc

  # The end-to-end suite (ADR-0010), against a Broker this job starts itself.
  # It is a separate job because it is minutes where `check` is seconds, and
  # because a failure here means something different: the stack, not the code.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `--wait` returns when the composition reports healthy, which is worth
      # exactly what the healthchecks in compose.yaml are worth: this job's
      # first run failed here, with Keycloak answering 503 while compose called
      # it healthy, and the fix was in that file rather than in this one. A
      # cold runner is the only place that race is visible, so this job is
      # where it will show up again.
      #
      # Twice, because the image build resolves from Maven Central, Central
      # rate limits by IP, and a runner's addresses are shared with everybody
      # else's CI. What it covers is that build: a second `up --wait` waits on
      # the containers the first one left, so it cannot turn the race above
      # into a pass. Every failure of this step so far passed on a re-run
      # minutes later, never on a second try in the same second, which is what
      # the wait is for. Both attempts stay in the log — the second failure is
      # the one worth reading, and reading it means having the first beside it
      # (`issue #116`).
      #
      # It stays here rather than inside `broker:up`, because locally a failed
      # start is something to look at, not something to sit through twice.
      - name: Start the Broker
        run: |
          for attempt in 1 2; do
            [ "$attempt" = 1 ] || sleep 60
            echo "Starting the Broker, attempt $attempt"
            if pnpm broker:up; then exit 0; fi
          done
          exit 1

      # Not retried, and that is deliberate: a suite that passes on the second
      # try is a flaky suite, which is something to fix rather than something
      # to live with (`issue #116`).
      - run: pnpm test

      # Keycloak's own log is the only place that says why a flow was refused,
      # and the runner is thrown away with it. The Mock Identity
      # Source's is the other half of a refusal that happened there.
      - name: The Broker's and the Mock Identity Source's logs, when the suite failed
        if: failure()
        run: docker compose logs keycloak mock-source

  # The base alone, as a real deployment would run it. It is the only run that
  # shows the base starts without the testing layer, and the only one where
  # seam 2 can see a testing layer present where it should be absent. So it
  # runs the one file that asserts that, and none of the suite that needs the
  # testing layer to sign anyone in.
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Overrides `.env`, for compose and for the suite alike.
      BROKER_MODE: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Twice, for the reason the `tests` job gives.
      - name: Start the Broker, base alone
        run: |
          for attempt in 1 2; do
            [ "$attempt" = 1 ] || sleep 60
            echo "Starting the Broker, attempt $attempt"
            if pnpm broker:up; then exit 0; fi
          done
          exit 1

      - run: pnpm exec vitest run tests/declaration.test.ts

      - name: The Broker's log, when the case failed
        if: failure()
        run: docker compose logs keycloak
